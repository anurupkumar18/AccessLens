<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Binary tree traversal</title>
<style>body{font:16px system-ui,sans-serif;margin:0;padding:1rem;background:#102033;color:#f5f8fb}main{max-width:700px;margin:auto}svg{display:block;width:100%;height:300px;background:#f8fbff;border-radius:8px}.node,.choice{fill:#2c7be5;stroke:#102033;stroke-width:2}.active{fill:#f59e0b;stroke:#fff;stroke-width:4}.edge,.axis{stroke:#789;stroke-width:3;fill:none}.curve{stroke:#2c7be5;stroke-width:4;fill:none}.label{fill:#102033;font-size:15px}button{font:inherit;margin:.25rem;padding:.4rem .7rem}.hint{color:#c7d9ec}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style></head>
<body><main><h1>Binary tree traversal</h1><p class="hint">Explore preorder, inorder, and postorder traversal of a binary search tree.</p><svg id="visual" role="group" aria-label="Explore preorder, inorder, and postorder traversal of a binary search tree."><title>Explore preorder, inorder, and postorder traversal of a binary search tree.</title><line class="edge" x1="120" y1="150" x2="300" y2="80"/><line class="edge" x1="300" y1="80" x2="500" y2="150"/><line class="edge" x1="300" y1="80" x2="300" y2="230"/><circle class="choice" role="button" data-choice="start" tabindex="0" cx="120" cy="150" r="30"/><circle class="choice" role="button" data-choice="current" tabindex="0" cx="300" cy="80" r="30"/><circle class="choice" role="button" data-choice="result" tabindex="0" cx="500" cy="150" r="30"/><circle class="choice" role="button" data-choice="frontier" tabindex="0" cx="300" cy="230" r="30"/></svg><p id="readout" class="sr" aria-live="polite"></p><p class="hint">Keyboard: Right arrow or Space advances; Left arrow goes back; Tab reaches each node.</p><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></main>
<script>
(function(){
  const svg=document.getElementById('visual'), readout=document.getElementById('readout'); let step=0, highlighted='';
  const choices=[...svg.querySelectorAll('[data-choice]')];
  function draw(){ const selected=highlighted||choices[step%Math.max(choices.length,1)]?.dataset.choice||'item-0';
    choices.forEach(choice=>{const active=choice.dataset.choice===selected;choice.classList.toggle('active',active);choice.setAttribute('aria-label',choice.dataset.choice+(active?' selected':''));choice.setAttribute('aria-pressed',String(active));});
    readout.textContent='Step '+step+': selected '+selected+'. Use next or previous to inspect the sequence.';
  }
  function move(delta){step=Math.max(0,step+delta);draw()}
  document.getElementById('next').addEventListener('click',()=>move(1)); document.getElementById('previous').addEventListener('click',()=>move(-1));
  choices.forEach(choice=>{choice.addEventListener('click',()=>{highlighted=choice.dataset.choice;draw()});choice.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();highlighted=choice.dataset.choice;draw()}})});
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)} else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
  window.accesslensInit=function(params,ctx){step=Number(params&&params.step||0); highlighted=ctx&&ctx.highlightRegionId||''; draw()};
  window.accesslensHighlight=function(regionId){highlighted=regionId||'';draw()};
  draw();
})();
</script></body></html>
