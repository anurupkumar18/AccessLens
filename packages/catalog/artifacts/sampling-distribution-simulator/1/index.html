<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sampling distribution simulator</title>
<style>body{font:16px system-ui,sans-serif;margin:0;padding:1rem;background:#102033;color:#f5f8fb}main{max-width:700px;margin:auto}svg{display:block;width:100%;height:300px;background:#f8fbff;border-radius:8px}.node,.choice{fill:#2c7be5;stroke:#102033;stroke-width:2}.active{fill:#f59e0b;stroke:#fff;stroke-width:4}.edge,.axis{stroke:#789;stroke-width:3;fill:none}.curve{stroke:#2c7be5;stroke-width:4;fill:none}.label{fill:#102033;font-size:15px}button{font:inherit;margin:.25rem;padding:.4rem .7rem}.hint{color:#c7d9ec}</style></head>
<body><main><h1>Sampling distribution simulator</h1><p class="hint">Draw repeated samples and compare sample means with the population distribution.</p><svg id="visual" role="img" aria-label="Draw repeated samples and compare sample means with the population distribution."><line class="axis" x1="70" y1="250" x2="635" y2="250"/><rect class="choice" data-choice="sample-1" tabindex="0" x="110" y="180" width="55" height="70"/><rect class="choice" data-choice="sample-2" tabindex="0" x="190" y="130" width="55" height="120"/><rect class="choice" data-choice="sample-mean" tabindex="0" x="270" y="75" width="55" height="175"/><rect class="choice" data-choice="sample-4" tabindex="0" x="350" y="130" width="55" height="120"/><rect class="choice" data-choice="sample-5" tabindex="0" x="430" y="180" width="55" height="70"/></svg><p id="readout" aria-live="polite"></p><p class="hint">Keyboard: Right arrow or Space advances; Left arrow goes back; Tab reaches each node.</p><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></main>
<script>
(function(){
  const svg=document.getElementById('visual'), readout=document.getElementById('readout'); let step=0, highlighted='';
  const choices=[...svg.querySelectorAll('[data-choice]')];
  function draw(){ const selected=highlighted||choices[step%Math.max(choices.length,1)]?.dataset.choice||'item-0';
    choices.forEach(choice=>{const active=choice.dataset.choice===selected;choice.classList.toggle('active',active);choice.setAttribute('aria-label',choice.dataset.choice+(active?' selected':''));});
    readout.textContent='Step '+step+': selected '+selected+'. Use next or previous to inspect the sequence.';
  }
  function move(delta){step=Math.max(0,step+delta);draw()}
  document.getElementById('next').addEventListener('click',()=>move(1)); document.getElementById('previous').addEventListener('click',()=>move(-1));
  document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();move(1)} else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}});
  window.accesslensInit=function(params,ctx){step=Number(params&&params.step||0); highlighted=ctx&&ctx.highlightRegionId||''; draw()};
  window.accesslensHighlight=function(regionId){highlighted=regionId||'';draw()};
  draw();
})();
</script></body></html>
