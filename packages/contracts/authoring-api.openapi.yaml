components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 'Google ID token (JWT)'
  schemas:
    getHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        version:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
      required:
        - ok
        - version
        - region
      additionalProperties: false
    getMeResponse:
      type: object
      properties:
        instructor:
          type: object
          properties:
            sub:
              type: string
              minLength: 1
            email:
              type: string
              minLength: 3
            name:
              type: string
              minLength: 1
            createdAt:
              type: string
              format: date-time
              pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
            lastSeenAt:
              type: string
              format: date-time
              pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
          required:
            - sub
            - email
            - createdAt
            - lastSeenAt
          additionalProperties: false
        profiles:
          type: array
          items:
            type: object
            properties:
              profileId:
                type: string
                minLength: 1
              ownerSub:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              subject:
                type: string
                minLength: 1
              level:
                type: string
                minLength: 1
              createdAt:
                type: string
                format: date-time
                pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
              vectorIndexName:
                type: string
                minLength: 1
            required:
              - profileId
              - name
              - subject
              - level
              - createdAt
              - vectorIndexName
            additionalProperties: false
      required:
        - instructor
        - profiles
      additionalProperties: false
    createUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
