openapi: 3.1.0
info:
  title: 'AccessLens Authoring API'
  version: 1.0.0
  description: 'HTTP API for instructor uploads, authoring jobs, review, and published Access Packs.'
servers:
  -
    url: 'https://{apiId}.execute-api.{region}.amazonaws.com'
    description: 'Deployed API Gateway HTTP API'
security:
  -
    bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: 'Liveness and deployed version'
      security:
        -
          bearerAuth: []
      responses:
        '200':
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getHealthResponse'
        '400':
          description: 'Invalid request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 'Missing, expired or invalid Google ID token'
        '403':
          description: 'Signed in, but not on this deployment''s instructor allowlist'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 'Pipeline failure'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '501':
          description: 'Milestone not implemented'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/me:
