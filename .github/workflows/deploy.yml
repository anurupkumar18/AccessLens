name: Deploy

# Five people and their agents push to this repository, so the deploy has to be
# boring: it runs the same checks a PR does, it never runs two at once, and it
# never deploys something that did not pass.
on:
  push:
    # master only. Both lines used to deploy the same stacks, so a push to the
    # integration line redeployed its older infra over master's.
    branches: [master]
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Deploy without running checks (demo emergencies only)'
        type: boolean
        default: false

# One deploy at a time, and let a newer commit supersede one that is still
# queued. Without this, two agents pushing a minute apart race each other into
# CloudFormation and the loser fails with an unhelpful conflict.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # required to request the GitHub OIDC token
  contents: read

jobs:
  check:
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Only service packages have lockfiles. services/api is bundled by CDK
      # from the root workspace, so attempting npm ci there fails before the
      # deployment can reach its OIDC role.
      - run: |
          for dir in services/*/; do
            [ -f "${dir}package.json" ] || continue
            npm ci --prefix "$dir"
          done
      # The ingest acceptance tests render the checked-in deck with Poppler and
      # LibreOffice, as in check.yml; without them make check fails and nothing
      # on master ever deploys.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-impress
      - run: make check

  deploy:
    needs: [check]
    # `always()` plus an explicit result test, so a deliberate skip_checks run
    # still deploys while a genuine check failure still blocks.
    if: ${{ always() && (needs.check.result == 'success' || inputs.skip_checks) }}
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the deploy role is configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN repository variable is not set."
            echo "A repository admin must do the one-time setup in docs/DEPLOYMENT.md,"
            echo "section 'One-time setup: GitHub deploy role'."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: accesslens-deploy-${{ github.run_id }}

      # `cdk deploy --all` packages every Lambda from services/*/dist, which is
      # not committed. Building only some of them fails synth for the
      # accessibility stack (captions, recap, translate-speak) and course media.
      - name: Build the Lambda bundles
        run: |
          npm ci
          for dir in services/*/; do
            [ -f "${dir}package.json" ] || continue
            npm ci --prefix "$dir"
            npm run build --prefix "$dir"
          done

      # AccessLensAuthoring is deployed by infra/scripts/deploy.sh because it
      # owns the Google OAuth client and hosted web assets. Its public outputs
      # still configure the downloadable extension and the relay pack source.
      - name: Read deployed authoring configuration
        run: |
          aws cloudformation describe-stacks --stack-name AccessLensAuthoring --output json > /tmp/authoring-stack.json
          node -e '
            const { appendFileSync, readFileSync } = require("node:fs");
            const stack = JSON.parse(readFileSync("/tmp/authoring-stack.json", "utf8"));
            const outputs = Object.fromEntries((stack.Stacks[0]?.Outputs ?? []).map(output => [output.OutputKey, output.OutputValue]));
            const required = { VITE_ACCESSLENS_API_URL: "ApiUrl", VITE_GOOGLE_CLIENT_ID: "GoogleClientId", VITE_ACCESSLENS_ASSET_BASE_URL: "AssetBaseUrl" };
            for (const [env, key] of Object.entries(required)) {
              if (!outputs[key]) throw new Error(`AccessLensAuthoring is missing ${key}`);
              appendFileSync(process.env.GITHUB_ENV, `${env}=${outputs[key]}\n`);
            }
            console.log("Loaded public authoring configuration from AccessLensAuthoring.");
          '

      # From infra/, where cdk.json names the app; run from the repo root, the
      # CDK CLI finds no app to deploy. AccessLensAuthoring is not deployed here:
      # it needs the Google OAuth client id and its web builds, so
      # infra/scripts/deploy.sh deploys it. Synth still constructs it, so its
      # asset folders only have to exist.
      - name: Deploy the stacks
        run: |
          mkdir -p ../apps/viewer/dist ../dist-web
          npm ci
          npx cdk deploy AccessLensLiveSession AccessLensAccessibility AccessLensCourseMedia AccessLensDistribution AccessLensOrbExplain \
            --require-approval never --outputs-file /tmp/outputs.json
        working-directory: infra

      - name: Rebuild the extension against the deployed endpoints
        run: |
          node -e '
            const o = require("/tmp/outputs.json");
            const find = (k) => Object.values(o).map(s => s[k]).find(Boolean) ?? "";
            const lines = [
              `VITE_ACCESSLENS_WS_URL=${find("WebSocketUrl") || find("LiveSessionUrl")}`,
              `VITE_ACCESSLENS_API_URL=${find("ApiUrl") || process.env.VITE_ACCESSLENS_API_URL || ""}`,
              `VITE_GOOGLE_CLIENT_ID=${find("GoogleClientId") || process.env.VITE_GOOGLE_CLIENT_ID || ""}`,
              `VITE_ACCESSLENS_ORB_ENDPOINT=${find("OrbExplainUrl")}`,
              `VITE_ACCESSLENS_ASSET_BASE_URL=${find("DistributionUrl") || process.env.VITE_ACCESSLENS_ASSET_BASE_URL || ""}`,
              `VITE_ACCESSLENS_CAPTIONS_ENDPOINT=${find("CaptionsUrl")}`,
              `VITE_ACCESSLENS_RECAP_ENDPOINT=${find("RecapUrl")}`,
              `VITE_ACCESSLENS_TRANSLATE_ENDPOINT=${find("TranslateSpeakUrl")}`,
              `VITE_ACCESSLENS_COURSE_MEDIA_ENDPOINT=${find("CourseMediaUrl")}`,
            ];
            require("fs").writeFileSync(".env.local", lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
          npm run build

      - name: Package the extension for download
        run: |
          cd dist && zip -qr ../accesslens-extension.zip . && cd ..
          echo "packed $(du -h accesslens-extension.zip | cut -f1)"

      - name: Publish the extension and pack assets
        run: |
          BUCKET=$(node -e '
            const o = require("/tmp/outputs.json");
            console.log(Object.values(o).map(s => s.DistributionBucket).find(Boolean) ?? "");
          ')
          if [ -z "$BUCKET" ]; then
            echo "::notice::No distribution bucket in outputs; skipping publish."
            exit 0
          fi
          aws s3 cp accesslens-extension.zip "s3://$BUCKET/accesslens-extension.zip"
          aws s3 sync packages/access-packs/bio-cell-demo "s3://$BUCKET/packs/bio-cell-demo" --delete
          aws s3 cp docs/install.html "s3://$BUCKET/index.html" || true

          DOMAIN=$(node -e '
            const o = require("/tmp/outputs.json");
            const url = Object.values(o).map(s => s.DistributionUrl).find(Boolean) ?? "";
            console.log(url ? new URL(url).hostname : "");
          ')
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='${DOMAIN}'].Id | [0]" --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "::error::Could not resolve the CloudFront distribution for ${DOMAIN}."
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths '/accesslens-extension.zip' '/index.html' '/packs/bio-cell-demo/*'

      - name: Summarise what is live
        run: |
          echo "### AccessLens deployed" >> $GITHUB_STEP_SUMMARY
          node -e '
            const o = require("/tmp/outputs.json");
            for (const [stack, outs] of Object.entries(o))
              for (const [k, v] of Object.entries(outs))
                console.log(`- **${k}** (${stack}): ${v}`);
          ' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: accesslens-extension
          path: accesslens-extension.zip
          retention-days: 7
