name: Check

on:
  pull_request:
  push:
    # The hackathon is built on an integration branch, so watch it too.
    # Without this, nothing between now and the final merge is checked on push.
    branches: [main, master, accesslens-extension-ar-pivot]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `make check` runs `npm run check`, which needs the dev dependencies.
      # Without these two steps it fails with `sh: vitest: command not found`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # services/live-session is its own package with its own dependencies
      # and lockfile (Part 4's live-session-check target), so the root
      # `npm ci` above does not cover it -- without this it fails with
      # "Cannot find module '@aws-sdk/...'" instead of running any tests.
      - run: npm ci --prefix services/live-session
      # Part 6's ingest acceptance tests render the checked-in deck with the
      # same Poppler and LibreOffice the ingest Lambda container carries.
      # Without these the [slow] tests fail with "spawnSync pdftoppm ENOENT".
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-impress
      # services/ai-gateway likewise; the root test run also imports its tests.
      - run: npm ci --prefix services/ai-gateway
      - run: make check
